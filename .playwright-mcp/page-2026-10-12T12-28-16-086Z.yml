      - generic [ref=f7e298]:
        - heading "Frequently Asked Questions" [level=2] [ref=f7e299]
        - paragraph [ref=f7e300]: provides important details and answers to frequently asked questions
      - generic [ref=f7e301]:
        - generic [ref=f7e302]:
          - button "Why should I book with VConnect Holidays instead of booking online myself?" [expanded] [ref=f7e303] [cursor=pointer]
          - paragraph [ref=f7e308]: While online portals offer options, we offer peace of mind and expertise. With us, you get a dedicated travel expert who customizes your trip to your preferences, handles all the complex logistics, and provides 24/7 on-trip support. We save you time, prevent common travel mistakes, and often have access to better deals and arrangements.
        - generic [ref=f7e309]:
          - button "What types of holiday packages do you offer?" [ref=f7e310] [cursor=pointer]
          - paragraph [ref=f7e314]: We offer a wide range of packages to suit every traveler, including romantic honeymoon getaways, fun-filled family vacations, adventurous trips, relaxing beach holidays, cultural tours, and more. We specialize in destinations across India like Himachal, Kerala, and Goa, as well as international hotspots like Dubai, Maldives, Thailand, and Europe.
        - generic [ref=f7e315]:
          - button "Can you create a custom tour package for me?" [ref=f7e316] [cursor=pointer]
          - paragraph [ref=f7e320]: Absolutely! Customization is our specialty. If you have a specific destination or travel plan in mind, our experts will work with you to design a tailor-made itinerary that fits your interests, timeline, and budget perfectly.
        - generic [ref=f7e321]:
          - button "What if I face an issue during my trip? Is there someone I can contact?" [ref=f7e322] [cursor=pointer]
          - paragraph [ref=f7e326]: Yes! When you book with us, you are never alone. You will be provided with a dedicated contact number for our on-trip support team, which is available 24/7 to assist you with any emergencies or issues you may face during your vacation.
        - generic [ref=f7e327]:
          - button "When will I receive my flight tickets, hotel vouchers, and other travel documents?" [ref=f7e328] [cursor=pointer]
          - paragraph [ref=f7e332]: You will receive all your travel documents, including e-tickets, hotel confirmation vouchers, and a detailed day-by-day itinerary, via email well before your departure date, typically after the final payment has been cleared.
